<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>门户登录 - GEO 洞察平台</title>
    <style>
      :root {
        --bg: #f5f6f7;
        --surface: #ffffff;
        --ink: #1f2933;
        --muted: #66717d;
        --line: #dfe4e8;
        --teal: #0f766e;
        --red: #b91c1c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      }
      .card {
        width: min(360px, calc(100vw - 32px));
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 32px 28px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 7px;
        background: var(--teal);
        color: #ffffff;
        font-weight: 700;
        font-size: 18px;
      }
      .brand small {
        color: var(--muted);
        display: block;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 9px 11px;
        margin-bottom: 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }
      input:focus {
        outline: 2px solid var(--teal);
        outline-offset: -1px;
        border-color: var(--teal);
      }
      button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        background: var(--teal);
        color: #ffffff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .error {
        color: var(--red);
        font-size: 13px;
        min-height: 20px;
        margin: 0 0 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <span class="brand-mark">G</span>
        <div>
          <strong>GEO 洞察平台</strong>
          <small>正在跳转到门户登录</small>
        </div>
      </div>
      <p class="error">账户和密码由门户统一管理。</p>
      <button type="button" onclick="window.location.replace('/portal/login')">返回门户登录</button>
    </main>
    <script>
      window.setTimeout(() => window.location.replace("/portal/login"), 50);
    </script>
  </body>
</html>
