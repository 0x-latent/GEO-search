services:
  geo-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${GEO_IMAGE:-geo-search-workbench:latest}
    ports:
      # portal 网关就绪后在 .env 设 GEO_BIND=127.0.0.1 即可收回公网直连
      - "${GEO_BIND:-0.0.0.0}:${GEO_PORT:-8000}:8000"
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GEO_ADMIN_PASSWORD: ${GEO_ADMIN_PASSWORD:-admin123}
      # portal SSO 共享密钥：网关请求需携带 X-Portal-Secret 才能注入身份头；留空=关闭该通道
      GEO_PORTAL_SECRET: ${GEO_PORTAL_SECRET:-}
      GEO_ARTICLE_REVIEW_CONCURRENCY_MAX: ${GEO_ARTICLE_REVIEW_CONCURRENCY_MAX:-5}
    volumes:
      - ./config/api_keys.yaml:/app/config/api_keys.yaml:ro
      - ./config/brands.yaml:/app/config/brands.yaml
      - ./config/models.yaml:/app/config/models.yaml
      - ./config/source_domains.yaml:/app/config/source_domains.yaml
      - ./config/knowledge_base.json:/app/config/knowledge_base.json
      - ./questions:/app/questions
      - ./docs/products_db:/app/docs/products_db
      - ./results:/app/results
      - ./backend/data:/app/backend/data
      - ./data/geo_datasets:/app/data/geo_datasets
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  geo-review-worker:
    image: ${GEO_IMAGE:-geo-search-workbench:latest}
    command: ["python", "-m", "backend.app.workers.article_review_worker"]
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      GEO_ARTICLE_REVIEW_CONCURRENCY_MAX: ${GEO_ARTICLE_REVIEW_CONCURRENCY_MAX:-5}
    volumes:
      - ./config/api_keys.yaml:/app/config/api_keys.yaml:ro
      - ./config/brands.yaml:/app/config/brands.yaml:ro
      - ./config/models.yaml:/app/config/models.yaml:ro
      - ./config/knowledge_base.json:/app/config/knowledge_base.json:ro
      - ./backend/data:/app/backend/data
      - ./data/geo_datasets:/app/data/geo_datasets
    mem_limit: ${GEO_ARTICLE_REVIEW_MEMORY_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

