    location /geo/ {
        auth_request /portal/auth/geo;
        auth_request_set $portal_user $upstream_http_x_portal_user;
        auth_request_set $portal_role $upstream_http_x_portal_role;
        error_page 401 403 = @portal_login;
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /geo;
        proxy_set_header X-Portal-User $portal_user;
        proxy_set_header X-Portal-Role $portal_role;
        proxy_set_header X-Portal-Secret __PORTAL_SECRET__;
        proxy_read_timeout 300s;
        client_max_body_size 22m;

        # 外部邀请使用自己的会话；其余业务接口继续使用门户鉴权。
        location ~ ^/geo/(?:article-submit\.html$|assets/|api/contributor/) {
            auth_request off;
            rewrite ^/geo/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8001;
            proxy_cookie_path /api/contributor /geo/api/contributor;
        }
    }
